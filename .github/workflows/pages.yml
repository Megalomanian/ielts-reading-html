name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".opencode/skills/ielts-reading-html/**"
      - "writing-output/**"
      - "speaking-output/**"
      - "docs/pages-index.html"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify inputs exist
        run: |
          missing=0
          for f in \
            "writing-output/index.html" \
            "speaking-output/speaking-part2-materials.html" \
            ".opencode/skills/ielts-reading-html/examples/demo.html" \
            ".opencode/skills/ielts-reading-html/examples/demo-case.json" \
            "docs/pages-index.html"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare static site
        run: |
          mkdir -p site/writing site/reading site/speaking
          cp writing-output/index.html site/writing/index.html
          cp speaking-output/speaking-part2-materials.html site/speaking/index.html
          cp speaking-output/speaking-part2-materials.pdf site/speaking/materials.pdf
          cp .opencode/skills/ielts-reading-html/examples/demo.html site/reading/index.html
          cp .opencode/skills/ielts-reading-html/examples/demo-case.json site/reading/demo-case.json
          cp docs/pages-index.html site/index.html
          touch site/.nojekyll
          find site -type f -printf '%8s  %p\n' | sort -k2

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
