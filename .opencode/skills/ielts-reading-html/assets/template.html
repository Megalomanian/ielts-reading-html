<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="IELTS Reading 互动解析：逐字原文、题目、答案与可点击的关键词定位。">
<meta name="color-scheme" content="light">
<meta name="generator" content="ielts-reading-html">
<title><!--BUILD:TITLE--></title>
<script>document.documentElement.classList.add('js');</script>
<style>
:root{
  --bg:#f2efe7;
  --paper:#fffdf8;
  --paper-2:#faf7ef;
  --ink:#1f2933;
  --ink-2:#48545f;
  --muted:#5b6672;
  --line:#e3dccf;
  --line-strong:#cfc5b4;
  --accent:#0f766e;
  --accent-2:#115e59;
  --accent-soft:#ccfbf1;
  --accent-pale:#f0fdfa;
  --amber:#d97706;
  --amber-soft:#fef3c7;
  --amber-strong:#fbbf24;
  --danger:#b91c1c;
  --danger-soft:#fef2f2;
  --shadow:0 10px 32px rgba(44,52,58,.08);
  --shadow-sm:0 2px 8px rgba(44,52,58,.05);
  --radius:16px;
  --radius-sm:10px;
  --topbar-h:78px;
  --sans:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:Georgia,"Times New Roman","Songti SC","SimSun",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  background:
    radial-gradient(circle at 12% 0%,rgba(15,118,110,.055),transparent 34rem),
    radial-gradient(circle at 92% 4%,rgba(217,119,6,.045),transparent 28rem),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:var(--accent-2);text-underline-offset:2px}
button{font-family:inherit}
h1,h2,h3,h4,p,ul,ol{margin-top:0}
::selection{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(242,239,231,.9);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1500px;margin:0 auto;padding:13px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{
  flex:0 0 auto;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),#0b5f59);
  color:#fff;font-family:var(--serif);font-size:19px;font-weight:700;
  box-shadow:0 4px 12px rgba(15,118,110,.25);
}
.brand-text{min-width:0}
.brand-text h1{
  margin:0;font-size:19px;line-height:1.3;font-weight:750;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw;
}
.brand-sub{margin:1px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.meta-chips{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 7px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,253,248,.6);
  font-size:10.5px;line-height:1.5;color:var(--ink-2);white-space:nowrap;
}
.chip-accent{border-color:#b7e8df;background:var(--accent-pale);color:var(--accent-2)}
.chip-warn{border-color:#f3d59b;background:#fffbeb;color:#92400e}
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.btn{
  appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);
  padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:650;
  line-height:1.2;cursor:pointer;white-space:nowrap;
  transition:border-color .15s ease,background .15s ease,color .15s ease,transform .1s ease;
}
.btn:hover{border-color:var(--accent);color:var(--accent-2);background:#fff}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn svg{width:14px;height:14px;flex:0 0 auto}

/* ---------- layout ---------- */
.workspace{
  max-width:1500px;margin:0 auto;padding:20px 24px 64px;
  display:grid;grid-template-columns:minmax(0,.94fr) minmax(0,1.06fr);
  gap:20px;align-items:start;
}
.pane{
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
}
.passage-pane{
  position:sticky;top:calc(var(--topbar-h) + 14px);
  max-height:calc(100vh - var(--topbar-h) - 28px);
  overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;
}
.passage-pane::-webkit-scrollbar{width:9px}
.passage-pane::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px;border:2px solid var(--paper)}
.passage-pane .pane-head{position:sticky;top:0;z-index:6}
.question-pane{min-width:0}
.pane-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,253,248,.97),rgba(255,253,248,.9));
  backdrop-filter:blur(8px);
}
.pane-head h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2)}
.pane-head p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.pane-hint{font-size:11px;color:var(--muted);text-align:right;line-height:1.45}
.pane-inner{padding:24px 26px 28px}

/* ---------- passage ---------- */
.passage-nav{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  padding:10px 22px;border-bottom:1px solid var(--line);background:var(--paper-2);
  font-size:11px;color:var(--muted);
}
.passage-nav span{padding-right:2px}
.passage-nav a{
  display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;
  padding:0 9px;border:1px solid var(--line);border-radius:999px;
  color:var(--ink-2);text-decoration:none;font-weight:650;background:var(--paper);
}
.passage-nav a:hover{border-color:var(--accent);color:var(--accent-2)}
.passage + .passage{margin-top:40px;padding-top:30px;border-top:1px solid var(--line)}
.passage-kicker{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.passage-title{
  margin:6px 0 12px;font-family:var(--serif);font-weight:700;
  font-size:clamp(23px,2.2vw,29px);line-height:1.22;letter-spacing:-.01em;color:#18232c;
}
.passage-intro{
  margin:0 0 20px;padding:9px 12px;border-left:3px solid var(--line-strong);
  background:var(--paper-2);border-radius:0 8px 8px 0;
  font-family:var(--serif);font-size:13.5px;font-style:italic;line-height:1.65;color:var(--ink-2);
}
.passage-body{font-family:var(--serif);font-size:16.5px;line-height:1.82;color:#25323b}
.para{
  position:relative;margin:0 0 17px;padding-left:2.15rem;
  scroll-margin-top:calc(var(--topbar-h,78px) + 14px);border-radius:6px;
  transition:background .25s ease,box-shadow .25s ease;
}
.para.no-label{padding-left:0}
.para:last-child{margin-bottom:0}
.para-label{
  position:absolute;left:0;top:.18em;
  font-family:var(--sans);font-size:11px;font-weight:800;color:var(--accent);
  background:var(--accent-pale);border:1px solid #c7eee8;border-radius:5px;
  width:1.65rem;height:1.45rem;display:grid;place-items:center;line-height:1;
}
.para.is-target{
  background:linear-gradient(90deg,rgba(251,191,36,.14),rgba(251,191,36,.03) 62%,transparent);
  box-shadow:0 0 0 6px rgba(251,191,36,.07);
  animation:targetJump .5s ease 2;
}
@keyframes targetJump{
  0%,100%{transform:translateY(0)}
  35%{transform:translateY(-4px)}
  65%{transform:translateY(1px)}
}
.para.is-target .para-label{background:#fffbeb;border-color:#f3d59b;color:#92400e}
mark.locate-hit{
  color:inherit;padding:0 .09em;border-radius:3px;
  background:linear-gradient(180deg,transparent 6%,#fde68a 6%,#fbbf24 94%,transparent 94%);
  box-shadow:0 0 0 2px rgba(245,158,11,.18);
  animation:hitPulse .9s ease 3;
  scroll-margin-top:calc(var(--topbar-h,78px) + 14px);
}
@keyframes hitPulse{0%,100%{background-color:#fde68a}50%{background-color:#fbbf24}}

/* ---------- question groups ---------- */
.group-nav{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  padding:10px 22px;border-bottom:1px solid var(--line);background:var(--paper-2);
  font-size:11px;color:var(--muted);
}
.group-nav a{
  display:inline-flex;align-items:center;height:26px;padding:0 9px;
  border:1px solid var(--line);border-radius:999px;background:var(--paper);
  color:var(--ink-2);text-decoration:none;font-weight:650;font-size:11px;
}
.group-nav a:hover{border-color:var(--accent);color:var(--accent-2)}
.qgroup{padding:25px 26px 4px;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--topbar-h,78px) + 14px)}
.qgroup:last-of-type{border-bottom:0}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.group-range{margin:0;font-size:11.5px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
.group-type{margin:0;font-size:11px;color:var(--muted);font-weight:650}
.instructions{
  margin:0 0 16px;padding:10px 13px;
  border:1px solid #d9ece7;border-left:3px solid var(--accent);
  border-radius:0 9px 9px 0;background:var(--accent-pale);
  font-size:12.8px;line-height:1.68;color:var(--ink-2);
}
.instructions p{margin:0 0 3px}
.instructions p:last-child{margin-bottom:0}
.shared-options{
  list-style:none;margin:0 0 18px;padding:12px 14px;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-2);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:7px 18px;
}
.shared-options li{display:flex;gap:8px;font-size:13.2px;line-height:1.55;color:var(--ink-2)}
.opt-label{flex:0 0 auto;min-width:1.7em;font-weight:800;color:var(--accent-2)}

/* ---------- question cards ---------- */
.qcard{padding:18px 0 19px;border-top:1px dashed var(--line);scroll-margin-top:calc(var(--topbar-h,78px) + 14px)}
.qcard:first-child{border-top:0;padding-top:0}
.qcard:last-child{padding-bottom:18px}
.q-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.qnum{
  flex:0 0 auto;width:27px;height:27px;border-radius:50%;
  display:grid;place-items:center;background:var(--accent);color:#fff;
  font-size:12.5px;font-weight:800;line-height:1;box-shadow:0 2px 6px rgba(15,118,110,.18);
}
.qtype{font-size:10.5px;font-weight:750;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.qstem{font-size:15.2px;line-height:1.7;color:#202c35;font-weight:550}
.qstem p{margin:0 0 6px}
.qstem p:last-child{margin-bottom:0}
.options{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.options li{display:flex;gap:9px;align-items:flex-start;font-size:14.2px;line-height:1.6;color:var(--ink-2)}
.options .opt-label{color:var(--accent-2);min-width:1.5em}
.q-actions{display:flex;align-items:center;gap:8px;margin-top:12px}
.toggle-answer{
  appearance:none;border:1px solid #b7e8df;background:var(--accent-pale);color:var(--accent-2);
  padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;
  transition:background .15s ease,border-color .15s ease;
}
.toggle-answer:hover{background:#e6faf5;border-color:var(--accent)}
.toggle-answer[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- answer + analysis ---------- */
.answer-box{margin-top:13px;padding-top:13px;border-top:1px dashed var(--line)}
.answer-line{
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  padding:9px 12px;border:1px solid #99f6e4;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,#ecfdf9,#f0fdfa);
}
.answer-tag{font-size:10.5px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2)}
.answer-value{font-size:19px;line-height:1.3;color:var(--accent-2);font-weight:800;letter-spacing:.01em}
.answer-note{font-size:12.5px;color:var(--ink-2)}
.confidence{
  display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;
  font-size:10.5px;font-weight:700;border:1px solid #f3d59b;background:#fffbeb;color:#92400e;
}
.confidence.low{border-color:#fecaca;background:var(--danger-soft);color:var(--danger)}
.review{
  margin-top:11px;padding:11px 13px;
  border:1px solid #f3d59b;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,#fffdf5,#fffbeb);
}
.review-label{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-size:10.5px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#92400e;
}
.review-label span{font-size:10.5px;font-weight:550;letter-spacing:0;text-transform:none;color:#7c5a1e}
.review-quote{
  display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;
  margin-top:8px;padding-top:8px;border-top:1px dashed #ead9b5;
  font-family:var(--serif);font-size:13.8px;line-height:1.65;color:#3f321a;
}
.review-quote:first-of-type{margin-top:6px;padding-top:0;border-top:0}
.review-para{
  flex:0 0 auto;display:grid;place-items:center;min-width:1.5em;height:1.45em;
  border:1px solid #f3d59b;border-radius:5px;background:#fffdf5;
  font-family:var(--sans);font-size:10.5px;font-weight:800;color:#92400e;
}
.review-text{flex:1 1 220px;min-width:0;font-style:italic}
.review-locate{
  flex:0 0 auto;appearance:none;border:1px solid #e8c987;background:#fffdf5;color:#92400e;
  padding:3px 8px;border-radius:999px;font-family:var(--sans);font-size:10.5px;font-weight:700;
  cursor:pointer;white-space:nowrap;transition:background .15s ease,border-color .15s ease;
}
.review-locate:hover{background:var(--amber-soft);border-color:var(--amber)}
.review-locate.is-active{background:var(--amber-soft);border-color:var(--amber);color:#78350f}
.analysis{
  margin-top:11px;padding:12px 14px;border:1px solid #d9ece7;border-radius:var(--radius-sm);
  background:#f8fcfb;font-size:13.9px;line-height:1.82;color:#27343d;
}
.analysis-label{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-bottom:5px;font-size:10.5px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);
}
.analysis-label span{font-size:10.5px;font-weight:550;letter-spacing:0;text-transform:none;color:var(--muted)}
.analysis p{margin:0}
.analysis strong{font-weight:800;color:var(--accent-2)}
.kw{
  appearance:none;display:inline;border:0;margin:0 .03em;padding:.01em .1em;
  font:inherit;font-weight:750;line-height:inherit;color:var(--accent-2);
  background:linear-gradient(transparent 58%,var(--accent-soft) 58%);
  border-bottom:1px dashed var(--accent);border-radius:2px;cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.kw:hover{background:var(--accent-soft);color:var(--accent-2)}
.kw:active{background:#99f6e4}
.kw.is-active{background:linear-gradient(transparent 52%,#fde68a 52%);border-bottom-color:var(--amber);color:#92400e}
.kw.is-active::after{content:"";display:inline-block;width:.34em;height:.34em;margin-left:.22em;border-radius:50%;background:var(--amber);vertical-align:.14em}
.kw.flash{animation:kwFlash 1.2s ease 1}
@keyframes kwFlash{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}40%{box-shadow:0 0 0 4px rgba(245,158,11,.22)}}
.callout{
  margin-top:10px;padding:9px 12px;border-radius:var(--radius-sm);
  font-size:12.8px;line-height:1.7;
}
.callout b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.trap{border:1px solid #f3d59b;background:#fffbeb;color:#78350f}
.trap b{color:#92400e}
.vocab{margin-top:10px;border:1px solid var(--line);background:var(--paper-2);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px}
.vocab b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.vocab ul{margin:0;padding-left:17px;color:var(--ink-2)}
.vocab li{margin:1px 0}
.vocab em{font-style:normal;font-family:var(--serif);font-weight:700;color:var(--ink)}

/* ---------- answer key ---------- */
.answer-key{margin:20px 26px 26px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-2);overflow:hidden}
.answer-key summary{
  cursor:pointer;padding:11px 14px;font-size:12.5px;font-weight:800;color:var(--ink-2);
  display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none;
}
.answer-key summary::-webkit-details-marker{display:none}
.answer-key summary span{font-weight:550;color:var(--muted)}
.answer-key summary::after{content:"＋";color:var(--accent);font-weight:800}
.answer-key[open] summary::after{content:"－"}
.answer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;padding:0 14px 14px}
.answer-jump{
  display:flex;align-items:baseline;gap:6px;padding:5px 8px;border:1px solid var(--line);
  border-radius:7px;background:var(--paper);text-decoration:none;color:var(--ink);
  font-size:12px;line-height:1.4;
}
.answer-jump:hover{border-color:var(--accent);background:var(--accent-pale)}
.answer-jump .num{font-weight:800;color:var(--accent-2);min-width:1.5em}
.answer-jump .ans{font-weight:700;overflow-wrap:anywhere}

/* ---------- footer / misc ---------- */
.site-footer{max-width:1500px;margin:0 auto;padding:0 24px 34px;color:var(--muted);font-size:11.5px}
.site-footer p{margin:0 0 3px}
.site-footer .fine{font-size:10.5px;color:var(--muted)}
.noscript{
  margin:14px 24px 0;padding:10px 14px;border:1px solid #f3d59b;border-radius:9px;
  background:#fffbeb;color:#92400e;font-size:12.5px;
}
.back-btn{
  position:fixed;right:22px;bottom:22px;z-index:55;
  appearance:none;display:inline-flex;align-items:center;gap:7px;
  padding:10px 15px;border:0;border-radius:999px;
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;
  box-shadow:0 8px 22px rgba(31,41,51,.24);
}
.back-btn:hover{background:#111b23}
.back-btn[hidden]{display:none}
.toast{
  position:fixed;left:50%;bottom:24px;z-index:60;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  padding:9px 14px;border-radius:999px;background:rgba(31,41,51,.94);color:#fff;
  font-size:12px;font-weight:600;box-shadow:0 8px 22px rgba(31,41,51,.2);
  transition:opacity .2s ease,transform .2s ease;max-width:calc(100vw - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- narrower windows ---------- */
@media (max-width:860px){
  .workspace{grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 14px 40px}
  .passage-pane{position:static;max-height:none;overflow:visible}
  .pane{box-shadow:var(--shadow-sm)}
  .pane-head{position:static}
  .back-btn{bottom:22px;right:14px}
  .toast{bottom:24px}
  .site-footer{padding:0 14px 30px}
  .answer-key{margin:16px 14px 20px}
}
@media (max-width:640px){
  body{font-size:14.5px}
  .topbar-inner{padding:10px 12px;gap:10px}
  .brand{gap:9px}
  .brand-mark{width:33px;height:33px;border-radius:10px;font-size:16px}
  .brand-text h1{
    font-size:16px;max-width:58vw;white-space:normal;line-height:1.24;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .brand-sub{display:none}
  .meta-chips{margin-top:4px;gap:4px}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media print{
  @page{margin:15mm}
  body{background:#fff;font-size:11pt}
  .topbar,.back-btn,.toast,.q-actions,.pane-head,.passage-nav,.group-nav,.site-footer{display:none!important}
  .workspace{display:block;max-width:none;padding:0}
  .pane{position:static;max-height:none;overflow:visible;border:0;box-shadow:none;border-radius:0}
  .pane + .pane{margin-top:22px}

  .answer-box[hidden]{display:block!important}
  .qcard{break-inside:avoid;page-break-inside:avoid}
  .qgroup{break-inside:auto;padding-left:0;padding-right:0}
  .kw{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-style:dotted}
  .kw::after{display:none}
  mark.locate-hit{background:#fde68a;animation:none}
  .passage-body{font-size:11.5pt;line-height:1.65}
  .analysis{background:#fff;font-size:10pt}
}

<body>
<noscript><div class="noscript">本页的“点击关键词定位原文”需要 JavaScript。请启用 JavaScript 后重新打开。</div></noscript>
<!--BUILD:HEADER-->
<!--BUILD:BODY-->
<!--BUILD:FOOTER-->
<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var backBtn = document.getElementById("backToAnalysis");
  var toastEl = document.getElementById("toast");
  var activeKw = null;
  var toastTimer = null;

  function toast(message){
    if(!toastEl) return;
    toastEl.textContent = message;
    toastEl.classList.add("show");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  function setCard(card, open){
    if(!card) return;
    var box = card.querySelector(".answer-box");
    var btn = card.querySelector(".toggle-answer");
    if(!box || !btn) return;
    box.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
    var label = btn.querySelector(".btn-label");
    if(label) label.textContent = open ? "收起解析" : "显示答案与解析";
  }

  function allCards(){
    return Array.prototype.slice.call(document.querySelectorAll(".qcard"));
  }

  function updateToggleAll(){
    var btn = document.getElementById("toggleAll");
    if(!btn) return;
    var cards = allCards();
    if(!cards.length) return;
    var anyClosed = cards.some(function(card){
      var box = card.querySelector(".answer-box");
      return box && box.hidden;
    });
    var label = btn.querySelector(".btn-label");
    if(label) label.textContent = anyClosed ? "展开全部解析" : "收起全部解析";
  }

  function clearHits(){
    var hits = document.querySelectorAll("mark.locate-hit");
    for(var i=0;i<hits.length;i++){
      var mark = hits[i];
      var parent = mark.parentNode;
      if(!parent) continue;
      while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
      parent.removeChild(mark);
      parent.normalize();
    }
    var targets = document.querySelectorAll(".para.is-target");
    for(var j=0;j<targets.length;j++) targets[j].classList.remove("is-target");
  }

  function findRange(container, quote, occurrence){
    if(!container || !quote) return null;
    var text = container.textContent || "";
    var index = -1;
    var from = 0;
    for(var n=0;n<occurrence;n++){
      index = text.indexOf(quote, from);
      if(index < 0) return null;
      from = index + quote.length;
    }
    var endIndex = index + quote.length;
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
    var node, pos = 0, startNode = null, endNode = null, startOffset = 0, endOffset = 0;
    while((node = walker.nextNode())){
      var len = node.nodeValue.length;
      if(!startNode && index < pos + len){
        startNode = node;
        startOffset = index - pos;
      }
      if(startNode && endIndex <= pos + len){
        endNode = node;
        endOffset = endIndex - pos;
        break;
      }
      pos += len;
    }
    if(!startNode || !endNode) return null;
    var range = document.createRange();
    range.setStart(startNode, startOffset);
    range.setEnd(endNode, endOffset);
    return range;
  }

  function scrollToLocateTarget(para, target){
    var pane = para.closest(".passage-pane");
    if(pane && pane.scrollHeight > pane.clientHeight + 4){
      var paneRect = pane.getBoundingClientRect();
      var head = pane.querySelector(".pane-head");
      var headH = head ? head.offsetHeight : 0;
      var targetRect = target.getBoundingClientRect();
      var visibleTop = paneRect.top + headH;
      var visibleH = pane.clientHeight - headH;
      var delta = targetRect.top - visibleTop - Math.max(16, (visibleH - targetRect.height) / 2);
      pane.scrollTo({
        top: pane.scrollTop + delta,
        behavior: reduceMotion ? "auto" : "smooth"
      });
    }else{
      target.scrollIntoView({
        behavior: reduceMotion ? "auto" : "smooth",
        block: "center",
        inline: "nearest"
      });
    }
  }

  function locateKeyword(btn){
    clearHits();
    var active = document.querySelectorAll(".kw.is-active,.review-locate.is-active");
    for(var a=0;a<active.length;a++) active[a].classList.remove("is-active");
    btn.classList.add("is-active");
    activeKw = btn;

    var paraId = btn.getAttribute("data-para");
    var quote = btn.getAttribute("data-quote") || "";
    var occurrence = parseInt(btn.getAttribute("data-occurrence") || "1", 10);
    if(isNaN(occurrence) || occurrence < 1) occurrence = 1;
    var para = paraId ? document.getElementById(paraId) : null;
    if(!para){
      toast("没有找到对应的原文段落，请重新生成 HTML。");
      return;
    }
    var target = para.querySelector(".para-text") || para;
    window.requestAnimationFrame(function(){
      var range = findRange(target, quote, occurrence);
      var mark = null;
      if(range){
        try{
          mark = document.createElement("mark");
          mark.className = "locate-hit";
          range.surroundContents(mark);
        }catch(err){
          mark = null;
        }
      }
      para.classList.add("is-target");
      var scrollTarget = mark || para;
      scrollToLocateTarget(para, scrollTarget);
      if(backBtn) backBtn.hidden = false;
      var label = btn.getAttribute("data-para-label");
      toast(label ? ("已定位到第 " + label + " 段") : "已定位到原文");
    });
  }

  function openCard(card){
    setCard(card, true);
    updateToggleAll();
  }

  // top bar height -> sticky passage pane offset
  var topbar = document.querySelector(".topbar");
  function syncTopbar(){
    if(topbar) document.documentElement.style.setProperty("--topbar-h", topbar.offsetHeight + "px");
  }
  syncTopbar();
  window.addEventListener("resize", syncTopbar, {passive:true});
  if(window.ResizeObserver && topbar){ new ResizeObserver(syncTopbar).observe(topbar); }

  // answer toggles
  var toggleBtns = document.querySelectorAll(".toggle-answer");
  for(var i=0;i<toggleBtns.length;i++){
    toggleBtns[i].addEventListener("click", function(){
      var card = this.closest(".qcard");
      var box = card ? card.querySelector(".answer-box") : null;
      if(!box) return;
      setCard(card, box.hidden);
      updateToggleAll();
    });
  }

  var toggleAllBtn = document.getElementById("toggleAll");
  if(toggleAllBtn){
    toggleAllBtn.addEventListener("click", function(){
      var cards = allCards();
      if(!cards.length) return;
      var anyClosed = cards.some(function(card){
        var box = card.querySelector(".answer-box");
        return box && box.hidden;
      });
      cards.forEach(function(card){ setCard(card, anyClosed); });
      updateToggleAll();
      if(anyClosed) toast("已展开全部解析");
    });
  }

  var printBtn = document.getElementById("printBtn");
  if(printBtn) printBtn.addEventListener("click", function(){ window.print(); });

  // keyword + review-quote locate clicks
  var kws = document.querySelectorAll(".kw,.review-locate");
  for(var k=0;k<kws.length;k++){
    kws[k].addEventListener("click", function(){ locateKeyword(this); });
  }

  // back to the analysis that triggered the jump
  if(backBtn){
    backBtn.addEventListener("click", function(){
      if(!activeKw) return;
      var card = activeKw.closest(".qcard");
      if(card) openCard(card);
      backBtn.hidden = true;
      window.requestAnimationFrame(function(){
        activeKw.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "center"});
        activeKw.classList.add("flash");
        window.setTimeout(function(){ activeKw.classList.remove("flash"); }, 1300);
      });
    });
  }

  // answer-key jump links open the card before scrolling
  var answerJumps = document.querySelectorAll(".answer-jump");
  for(var j=0;j<answerJumps.length;j++){
    answerJumps[j].addEventListener("click", function(){
      var id = this.getAttribute("data-target");
      var card = id ? document.getElementById(id) : null;
      if(card) openCard(card);
    });
  }

  // deep link: #q-12 opens that question
  function handleHash(){
    var hash = window.location.hash || "";
    if(hash.indexOf("#q-") !== 0) return;
    var card = document.getElementById(hash.slice(1));
    if(!card) return;
    openCard(card);
    window.setTimeout(function(){ card.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "start"}); }, 60);
  }
  window.addEventListener("hashchange", handleHash);
  handleHash();

  updateToggleAll();
})();
</script>
</body>
