<style>
:root{
  --bg:#f2efe7;
  --paper:#fffdf8;
  --paper-2:#faf7ef;
  --ink:#1f2933;
  --ink-2:#48545f;
  --muted:#5b6672;
  --line:#e3dccf;
  --line-strong:#cfc5b4;
  --accent:#0f766e;
  --accent-2:#115e59;
  --accent-soft:#ccfbf1;
  --accent-pale:#f0fdfa;
  --amber:#d97706;
  --amber-soft:#fef3c7;
  --amber-strong:#fbbf24;
  --plum:#7c3a6d;
  --plum-soft:#fbeaf6;
  --danger:#b91c1c;
  --danger-soft:#fef2f2;
  --shadow:0 10px 32px rgba(44,52,58,.08);
  --shadow-sm:0 2px 8px rgba(44,52,58,.05);
  --radius:16px;
  --radius-sm:10px;
  --topbar-h:78px;
  --sans:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:Georgia,"Times New Roman","Songti SC","SimSun",serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  background:
    radial-gradient(circle at 12% 0%,rgba(15,118,110,.055),transparent 34rem),
    radial-gradient(circle at 92% 4%,rgba(217,119,6,.045),transparent 28rem),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:var(--accent-2);text-underline-offset:2px}
button{font-family:inherit}
h1,h2,h3,h4,p,ul,ol{margin-top:0}
::selection{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(242,239,231,.92);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1560px;margin:0 auto;padding:13px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{
  flex:0 0 auto;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),#0b5f59);
  color:#fff;font-family:var(--serif);font-size:19px;font-weight:700;
  box-shadow:0 4px 12px rgba(15,118,110,.25);
}
.brand-text{min-width:0}
.brand-text h1{
  margin:0;font-size:18px;line-height:1.3;font-weight:750;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw;
}
.brand-sub{margin:1px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.meta-chips{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 7px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,253,248,.6);
  font-size:10.5px;line-height:1.5;color:var(--ink-2);white-space:nowrap;
}
.chip-accent{border-color:#b7e8df;background:var(--accent-pale);color:var(--accent-2)}
.chip-warn{border-color:#f3d59b;background:#fffbeb;color:#92400e}
.chip-plum{border-color:#e6c3dc;background:var(--plum-soft);color:var(--plum)}
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.btn{
  appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);
  padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:650;
  line-height:1.2;cursor:pointer;white-space:nowrap;
  transition:border-color .15s ease,background .15s ease,color .15s ease,transform .1s ease;
}
.btn:hover{border-color:var(--accent);color:var(--accent-2);background:#fff}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn svg{width:14px;height:14px;flex:0 0 auto}

/* ---------- layout ---------- */
.shell{
  max-width:1560px;margin:0 auto;padding:22px 24px 64px;
  display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start;
}
.toc{position:sticky;top:calc(var(--topbar-h) + 16px);align-self:start;max-height:calc(100vh - var(--topbar-h) - 32px);overflow-y:auto;scrollbar-width:thin}
.toc-title{font-size:10.5px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 10px}
.toc-group{margin-bottom:14px}
.toc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 5px}
.toc-head b{font-size:12.5px;font-weight:800;color:var(--accent-2);letter-spacing:.01em}
.toc-head span{font-size:10px;color:var(--muted)}
.toc a{
  display:flex;align-items:baseline;gap:7px;
  padding:6px 10px;border-left:2px solid transparent;border-radius:0 7px 7px 0;
  color:var(--ink-2);text-decoration:none;font-size:12.5px;line-height:1.4;
}
.toc a:hover{background:rgba(255,253,248,.85);color:var(--accent-2)}
.toc a.is-current{border-left-color:var(--accent);background:var(--accent-pale);color:var(--accent-2);font-weight:700}
.toc a .n{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.toc a.is-current .n{color:var(--accent)}
.toc-foot{margin-top:16px;padding:10px;border:1px dashed var(--line-strong);border-radius:10px;font-size:11px;color:var(--muted);line-height:1.55;background:rgba(255,253,248,.5)}

.content{min-width:0}

/* ---------- hero ---------- */
.hero{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:26px;
}
.hero-inner{padding:26px 28px 22px}
.hero-kicker{font-size:10.5px;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.hero h2{
  margin:7px 0 10px;font-family:var(--serif);font-weight:700;
  font-size:clamp(24px,2.1vw,31px);line-height:1.2;letter-spacing:-.01em;color:#18232c;
}
.hero-lead{margin:0 0 18px;font-size:14px;line-height:1.8;color:var(--ink-2);max-width:78ch}
.hero-lead strong{color:var(--accent-2);font-weight:750}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:10px;margin-bottom:18px}
.stat{padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--paper-2)}
.stat b{display:block;font-size:20px;line-height:1.15;font-weight:800;color:var(--accent-2);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:3px;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.filterbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:13px 28px;border-top:1px solid var(--line);background:var(--paper-2)}
.filterbar span.lb{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.fchip{
  appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--paper);
  color:var(--ink-2);border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:650;line-height:1.5;
  transition:border-color .15s,background .15s,color .15s;
}
.fchip:hover{border-color:var(--accent);color:var(--accent-2)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- task block ---------- */
.task-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:30px 0 12px;padding-left:2px}
.task-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;color:#18232c}
.task-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted);max-width:90ch}
.task-head .count{font-size:11px;color:var(--muted);border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;white-space:nowrap}
.cat-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.cat-head h3{margin:0;font-size:15.5px;font-weight:800;color:var(--accent-2)}
.cat-head .cat-en{font-family:var(--serif);font-size:12.5px;color:var(--muted);font-style:italic}
.cat-head .cat-note{margin-left:auto;font-size:11px;color:var(--muted)}

/* ---------- case ---------- */
.case{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);margin-bottom:18px;overflow:hidden;
  scroll-margin-top:calc(var(--topbar-h) + 16px);
}
.case[hidden]{display:none}
.case-head{padding:19px 24px 15px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(250,247,239,.9),rgba(255,253,248,.6))}
.case-kicker{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.case-kicker .sep{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.case-title{margin:6px 0 0;font-size:17.5px;line-height:1.45;font-weight:750;color:#18232c;letter-spacing:-.005em}
.case-title .en{font-family:var(--serif);font-weight:600;color:var(--ink-2);font-size:15px;display:block;margin-top:2px}
.case-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.case-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;align-items:stretch}
.col-left{
  position:static;
  padding:20px 22px 24px;border-right:1px solid var(--line);
}
.col-right{padding:20px 22px 24px;min-width:0;background:linear-gradient(180deg,rgba(248,252,251,.55),rgba(255,253,248,0) 340px)}

.card-label{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:7px;font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card-label > span{min-width:0}
.card-label .fold-btn{display:inline-flex;width:auto;flex:0 0 auto;white-space:nowrap;letter-spacing:0;text-transform:none;margin:0}
.card-label em{font-style:normal;font-size:10px;font-weight:550;letter-spacing:0;text-transform:none;color:var(--muted)}

.prompt-card{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-2);padding:12px 14px;margin-bottom:14px}
.prompt-en{margin:0 0 8px;font-family:var(--serif);font-size:13.6px;line-height:1.72;color:#1e2a33}
.prompt-en .lead-in{font-weight:700}
.prompt-zh{margin:0;font-size:12.4px;line-height:1.75;color:var(--ink-2);padding-top:8px;border-top:1px dashed var(--line)}
.prompt-zh b{color:var(--accent-2);font-weight:750}

/* ---------- chart figures ---------- */
.chart-figure{margin:0 0 9px;padding:9px 10px 7px;border:1px solid var(--line);border-radius:9px;background:var(--paper);overflow-x:auto}
.tbl-wrap{overflow-x:auto}
.data-table{min-width:100%}
.chart-svg{display:block;width:100%;height:auto;max-height:236px}
.chart-cap{margin:6px 0 0;font-size:10.5px;line-height:1.55;color:var(--muted)}
.chart-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:10.5px;color:var(--ink-2)}
.chart-legend .lg{display:inline-flex;align-items:center;gap:5px}
.chart-legend .lg i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chart-legend .lg b{font-weight:750;color:var(--ink);font-variant-numeric:tabular-nums}
.pie-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.pie-panel{text-align:center}
.pie-svg{max-width:150px;margin:0 auto}
.pie-title{margin-top:2px;font-size:10.5px;font-weight:750;color:var(--accent-2)}
.pie-legend{justify-content:center;margin-top:4px;gap:2px 9px;font-size:10px}
.pie-legend .lg{gap:4px}
.flow-chain{list-style:none;margin:0;padding:0;display:grid;gap:5px;counter-reset:fl}
.flow-chain li{display:grid;grid-template-columns:1.5em 1fr;gap:8px;align-items:start;font-size:12px;line-height:1.6;color:var(--ink-2)}
.flow-chain .fs{
  display:grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;
  background:var(--accent-pale);border:1px solid #c7eee8;color:var(--accent-2);
  font-size:9.5px;font-weight:800;line-height:1;
}
.flow-chain .ft{font-weight:650;color:var(--ink)}
.flow-chain .ft em{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--muted);margin-top:1px}
.map-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.map-pane{border:1px solid var(--line);border-radius:8px;background:var(--paper-2);padding:8px 9px}
.map-pane h5{margin:0 0 5px;font-size:10.5px;font-weight:800;color:var(--accent-2);letter-spacing:.02em}
.map-pane ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.map-pane li{display:grid;grid-template-columns:auto 1fr;gap:6px;font-size:10.8px;line-height:1.5;color:var(--ink-2)}
.map-pane li b{font-weight:750;color:var(--ink)}

.data-table{width:100%;border-collapse:collapse;margin:11px 0 6px;font-size:11.5px;font-variant-numeric:tabular-nums}
.data-table caption{caption-side:top;text-align:left;font-size:10.5px;color:var(--muted);padding-bottom:5px}
.data-table th,.data-table td{border:1px solid var(--line-strong);padding:4px 6px;text-align:right;color:var(--ink-2);overflow-wrap:anywhere}
.data-table th{background:#f1ece1;font-weight:750;color:var(--ink);font-size:10.5px;line-height:1.35}
.data-table th:first-child,.data-table td:first-child{text-align:left}
.data-table tbody tr:nth-child(even) td{background:rgba(255,253,248,.7)}
.chart-note{margin:6px 0 0;font-size:10.5px;line-height:1.5;color:#92400e;background:#fffbeb;border:1px solid #f3d59b;border-radius:7px;padding:5px 8px}

.essay-card{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);padding:14px 16px 10px;position:relative}
.essay-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.essay-head .t{font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2)}
.essay-head .wc{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.epara{
  position:relative;margin:0 0 11px;padding:0 0 0 1.7rem;
  font-family:var(--serif);font-size:14.4px;line-height:1.85;color:#25323b;
  border-radius:6px;transition:background .25s ease,box-shadow .25s ease;
  scroll-margin-top:12px;
}
.epara:last-child{margin-bottom:4px}
.epara .plabel{
  position:absolute;left:0;top:.34em;width:1.15rem;height:1.15rem;
  display:grid;place-items:center;border-radius:5px;
  font-family:var(--sans);font-size:9.5px;font-weight:800;line-height:1;
  color:var(--accent);background:var(--accent-pale);border:1px solid #c7eee8;
}
.epara .gist{
  display:block;margin-top:3px;font-family:var(--sans);font-size:11.5px;line-height:1.6;color:var(--muted);
}
.epara.is-target{
  background:linear-gradient(90deg,rgba(251,191,36,.16),rgba(251,191,36,.03) 62%,transparent);
  box-shadow:0 0 0 6px rgba(251,191,36,.07);
  animation:targetJump .5s ease 2;
}
@keyframes targetJump{0%,100%{transform:translateY(0)}35%{transform:translateY(-4px)}65%{transform:translateY(1px)}}
.epara.is-target .plabel{background:#fffbeb;border-color:#f3d59b;color:#92400e}
body.hide-gist .epara .gist{display:none}
mark.locate-hit{
  color:inherit;padding:0 .09em;border-radius:3px;
  background:linear-gradient(180deg,transparent 6%,#fde68a 6%,#fbbf24 94%,transparent 94%);
  box-shadow:0 0 0 2px rgba(245,158,11,.18);
  animation:hitPulse .9s ease 3;
}
@keyframes hitPulse{0%,100%{background-color:#fde68a}50%{background-color:#fbbf24}}
.essay-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.mini-btn{
  appearance:none;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink-2);
  padding:4px 9px;border-radius:999px;font-size:11px;font-weight:650;cursor:pointer;line-height:1.5;
}
.mini-btn:hover{border-color:var(--accent);color:var(--accent-2)}
.mini-btn[aria-pressed="true"]{background:var(--accent-pale);border-color:#b7e8df;color:var(--accent-2)}

/* ---------- analysis ---------- */
.score-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:12px}
.score{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);position:relative}
.score .k{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:3px}
.score .k b{font-size:11px;font-weight:850;letter-spacing:.06em;color:var(--accent-2)}
.score .k i{font-style:normal;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.score p{margin:0;font-size:11.6px;line-height:1.62;color:var(--ink-2)}
.block{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);padding:11px 13px;margin-bottom:10px}
.block > .bl{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);margin-bottom:6px;
}
.block > .bl em{font-style:normal;font-size:10px;font-weight:550;letter-spacing:0;text-transform:none;color:var(--muted)}
.block p{margin:0 0 6px;font-size:12.6px;line-height:1.78;color:#2a3740}
.block p:last-child{margin-bottom:0}
.block strong{color:var(--accent-2);font-weight:750}
.struct{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.struct li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:12.4px;line-height:1.7;color:#2a3740}
.struct .sn{
  flex:0 0 auto;display:grid;place-items:center;min-width:3.4em;height:1.6em;padding:0 6px;
  border:1px solid #c7eee8;background:var(--accent-pale);border-radius:5px;
  font-size:9.5px;font-weight:800;color:var(--accent-2);letter-spacing:.02em;white-space:nowrap;
}
.struct .sd b{color:var(--ink);font-weight:750}
.tbl-wrap{overflow-x:auto;margin:0 -2px}
.data-table{min-width:100%}
.lex-list{display:grid;gap:7px}
.lex-item{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper-2)}
.lex-w{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink);line-height:1.5}
.lex-m{margin-top:1px;font-size:12px;line-height:1.6;color:var(--ink-2)}
.lex-note{margin-top:3px;font-size:11px;line-height:1.55;color:var(--muted)}
.gram-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.gram-list li{padding-left:11px;border-left:2px solid #d9ece7;font-size:12.3px;line-height:1.7;color:#2a3740}
.gram-list code{font-family:var(--serif);font-size:12.6px;color:var(--accent-2);background:var(--accent-pale);border-radius:3px;padding:0 3px}
.gram-list b{color:var(--ink);font-weight:750}
.examiner{border:1px solid #e6c3dc;background:linear-gradient(135deg,#fdf7fb,#fbeaf6);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:10px}
.examiner .bl{color:var(--plum)}
.examiner p{color:#4a2b41}
.examiner p strong{color:var(--plum)}
.pitfalls{border:1px solid #f3d59b;background:linear-gradient(135deg,#fffdf5,#fffbeb);border-radius:var(--radius-sm);padding:11px 13px}
.pitfalls .bl{color:#92400e}
.pitfalls ul{margin:0;padding-left:16px;font-size:12.3px;line-height:1.72;color:#5c4318}
.pitfalls li{margin:0 0 4px}
.pitfalls li:last-child{margin-bottom:0}
.pitfalls b{color:#78350f}
.kw{
  appearance:none;display:inline;border:0;margin:0 .03em;padding:.01em .1em;
  font:inherit;font-weight:750;line-height:inherit;color:var(--accent-2);
  background:linear-gradient(transparent 58%,var(--accent-soft) 58%);
  border-bottom:1px dashed var(--accent);border-radius:2px;cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.kw:hover{background:var(--accent-soft)}
.kw.is-active{background:linear-gradient(transparent 52%,#fde68a 52%);border-bottom-color:var(--amber);color:#92400e}
.kw.flash{animation:kwFlash 1.2s ease 1}
@keyframes kwFlash{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}40%{box-shadow:0 0 0 4px rgba(245,158,11,.22)}}
.fold-btn{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  appearance:none;border:0;background:transparent;padding:0;margin-bottom:8px;
  font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;
}
.fold-btn::after{content:"＋";color:var(--accent);font-weight:800;letter-spacing:0}
.fold-btn[aria-expanded="true"]::after{content:"－"}

/* ---------- appendix ---------- */
.appendix{margin-top:34px}
.appendix .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:22px 24px 24px}
.appendix h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.01em}
.appendix .sub{margin:0 0 16px;font-size:12.5px;color:var(--muted)}
.hot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.hot-block{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-2);padding:12px 14px}
.hot-block h3{margin:0 0 8px;font-size:12.5px;font-weight:800;color:var(--accent-2);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hot-block h3 span{font-size:10px;color:var(--muted);font-weight:550}
.hot-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.hot-list li{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:7px;font-size:12px;line-height:1.55;color:var(--ink-2)}
.hot-list .hits{font-variant-numeric:tabular-nums;font-weight:750;color:var(--accent);font-size:11px}
.hot-list .tx{min-width:0}
.hot-list .tx i{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}
.method-note{margin-top:16px;padding:11px 13px;border:1px dashed var(--line-strong);border-radius:9px;background:rgba(255,253,248,.6);font-size:11.5px;line-height:1.7;color:var(--muted)}
.method-note b{color:var(--ink-2)}

/* ---------- footer / misc ---------- */
.site-footer{max-width:1560px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:11.5px}
.site-footer p{margin:0 0 4px}
.site-footer .fine{font-size:10.5px}
.noscript{margin:14px 24px 0;padding:10px 14px;border:1px solid #f3d59b;border-radius:9px;background:#fffbeb;color:#92400e;font-size:12.5px}
.back-btn{
  position:fixed;right:22px;bottom:22px;z-index:55;
  appearance:none;display:inline-flex;align-items:center;gap:7px;
  padding:10px 15px;border:0;border-radius:999px;
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;
  box-shadow:0 8px 22px rgba(31,41,51,.24);
}
.back-btn:hover{background:#111b23}
.back-btn[hidden]{display:none}
.toast{
  position:fixed;left:50%;bottom:24px;z-index:60;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  padding:9px 14px;border-radius:999px;background:rgba(31,41,51,.94);color:#fff;
  font-size:12px;font-weight:600;box-shadow:0 8px 22px rgba(31,41,51,.2);
  transition:opacity .2s ease,transform .2s ease;max-width:calc(100vw - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{
  padding:34px 20px;border:1px dashed var(--line-strong);border-radius:var(--radius);
  background:rgba(255,253,248,.6);text-align:center;color:var(--muted);font-size:13px;
}
.empty[hidden]{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .case-grid{grid-template-columns:minmax(0,1fr)}
  .col-left{position:static;max-height:none;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}
  .col-right{background:none}
  .essay-card{max-width:none}
}
@media (max-width:1080px){
  .shell{grid-template-columns:minmax(0,1fr);padding:16px 16px 44px}
  .toc{position:static;max-height:none;margin-bottom:-4px}
  .toc-title,.toc-foot{display:none}
  .toc-group{margin-bottom:8px}
  .toc-head{display:none}
  .toc a{display:inline-flex;border-left:0;border:1px solid var(--line);border-radius:999px;background:rgba(255,253,248,.7);margin:0 4px 4px 0;padding:5px 10px;font-size:11.5px}
  .toc a.is-current{background:var(--accent);border-color:var(--accent);color:#fff}
  .toc a.is-current .n{color:rgba(255,255,255,.75)}
  .hero-inner{padding:20px 18px 16px}
  .filterbar{padding:11px 18px}
}
@media (max-width:640px){
  body{font-size:14.5px}
  .topbar-inner{padding:9px 12px;gap:8px;flex-wrap:wrap}
  .brand{flex:1 1 auto}
  .brand-mark{width:30px;height:30px;border-radius:9px;font-size:15px}
  .brand-text h1{font-size:14.5px;max-width:100%;white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .brand-sub{display:none}
  .meta-chips .chip-optional{display:none}
  .chip{font-size:9.5px;padding:1px 6px}
  .top-actions{flex:1 1 100%;justify-content:flex-start;gap:6px;flex-wrap:wrap}
  .top-actions .action-secondary{display:none}
  .btn{padding:6px 10px;font-size:11px}
  .shell{padding:12px 10px 30px;gap:12px}
  .case-head{padding:15px 15px 12px}
  .case-title{font-size:16px}
  .col-left,.col-right{padding:15px 15px 18px}
  .epara{font-size:14px;padding-left:1.5rem}
  .score-grid{grid-template-columns:minmax(0,1fr)}
  .appendix .card{padding:16px 15px 18px}
  .site-footer{padding:0 12px 34px}
  .filterbar{padding:10px 15px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt}
  .topbar,.toc,.filterbar,.back-btn,.toast,.essay-tools,.site-footer,.fold-btn,.empty{display:none!important}
  .shell{display:block;max-width:none;padding:0}
  .hero{box-shadow:none;border:0;border-bottom:1px solid #ccc;border-radius:0}
  .hero-inner{padding:0 0 10px}
  .hero-lead{max-width:none}
  .stat-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .case{box-shadow:none;border:0;border-top:1px solid #ccc;border-radius:0;margin-bottom:14px;break-inside:auto}
  .case-head{padding:10px 0 8px;background:none;break-after:avoid}
  .case-title{break-after:avoid}
  .case-grid{display:block}
  .col-left,.col-right{position:static;max-height:none;overflow:visible;padding:0;border:0;background:none}
  .col-left{margin-bottom:10px}
  .card-label{margin-top:8px}
  .chart-figure{break-inside:avoid;overflow:visible}
  .analysis-body[hidden]{display:block!important}
  .epara{font-size:10.6pt;line-height:1.6;break-inside:avoid}
  .kw{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-style:dotted}
  .kw::after{display:none}
  mark.locate-hit{background:#fde68a;animation:none}
  .prompt-card,.block,.score,.examiner,.pitfalls{break-inside:avoid}
  .essay-card{break-inside:auto;padding:0 0 4px;border:0}
  .essay-head,.essay-tools{break-inside:avoid}
  .appendix{padding-top:6px}
  .appendix .card{box-shadow:none;border:0;padding:0}
}
</style>
</head>
<body>
<noscript><div class="noscript">本页的「点击解析关键词定位范文句子」需要 JavaScript。请启用 JavaScript 后重新打开。</div></noscript>
<!--BUILD:HEADER-->
<!--BUILD:BODY-->
<!--BUILD:FOOTER-->
<button type="button" class="back-btn" id="backToAnalysis" hidden>返回解析</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var backBtn = document.getElementById("backToAnalysis");
  var toastEl = document.getElementById("toast");
  var activeKw = null, toastTimer = null;

  function toast(msg){
    if(!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  var topbar = document.querySelector(".topbar");
  function syncTopbar(){
    if(topbar) document.documentElement.style.setProperty("--topbar-h", topbar.offsetHeight + "px");
  }
  syncTopbar();
  window.addEventListener("resize", syncTopbar, {passive:true});
  if(window.ResizeObserver && topbar){ new ResizeObserver(syncTopbar).observe(topbar); }

  /* ---------- keyword locate ---------- */
  function clearHits(){
    var hits = document.querySelectorAll("mark.locate-hit");
    for(var i=0;i<hits.length;i++){
      var m = hits[i], p = m.parentNode;
      if(!p) continue;
      while(m.firstChild) p.insertBefore(m.firstChild, m);
      p.removeChild(m);
      p.normalize();
    }
    var t = document.querySelectorAll(".epara.is-target");
    for(var j=0;j<t.length;j++) t[j].classList.remove("is-target");
  }

  function findRange(container, quote){
    var text = container.textContent || "";
    var index = text.indexOf(quote);
    if(index < 0) return null;
    var endIndex = index + quote.length;
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
    var node, pos = 0, startNode = null, endNode = null, so = 0, eo = 0;
    while((node = walker.nextNode())){
      var len = node.nodeValue.length;
      if(!startNode && index < pos + len){ startNode = node; so = index - pos; }
      if(startNode && endIndex <= pos + len){ endNode = node; eo = endIndex - pos; break; }
      pos += len;
    }
    if(!startNode || !endNode) return null;
    var range = document.createRange();
    range.setStart(startNode, so);
    range.setEnd(endNode, eo);
    return range;
  }

  function scrollToTarget(para, target){
    // Single scroll container now: always scroll the page, never a nested pane.
    // Long jumps (a case can be taller than screens) look like a blur when smooth-scrolled,
    // so only animate short hops.
    var far = Math.abs(target.getBoundingClientRect().top - window.innerHeight / 2) > window.innerHeight * 1.5;
    var behavior = (reduceMotion || far) ? "instant" : "smooth";
    var from = Math.round(window.scrollY);
    // "instant" (not "auto") because CSS html{scroll-behavior:smooth} would still animate on "auto".
    target.scrollIntoView({behavior: behavior, block: "center", inline: "nearest"});
    if(behavior === "smooth"){
      // Some browsers and embedded views suppress smooth scrolling entirely. If nothing has
      // moved shortly after the request, jump instead of leaving the reader where they were.
      window.setTimeout(function(){
        if(Math.abs(Math.round(window.scrollY) - from) < 2){
          target.scrollIntoView({behavior: "instant", block: "center", inline: "nearest"});
        }
      }, 200);
    }
  }

  function locate(btn){
    clearHits();
    var act = document.querySelectorAll(".kw.is-active");
    for(var a=0;a<act.length;a++) act[a].classList.remove("is-active");
    btn.classList.add("is-active");
    activeKw = btn;

    var paraId = btn.getAttribute("data-para");
    var quote = btn.getAttribute("data-quote") || "";
    var para = paraId ? document.getElementById(paraId) : null;
    if(!para){ toast("没有找到对应的范文段落。"); return; }
    var range = findRange(para, quote);
    var mark = null;
    if(range){
      try{
        mark = document.createElement("mark");
        mark.className = "locate-hit";
        range.surroundContents(mark);
      }catch(e){ mark = null; }
    }
    para.classList.add("is-target");
    scrollToTarget(para, mark || para);
    if(backBtn) backBtn.hidden = false;
    toast(btn.getAttribute("data-label") || "已定位到范文");
  }

  var kws = document.querySelectorAll(".kw");
  for(var k=0;k<kws.length;k++) kws[k].addEventListener("click", function(){ locate(this); });

  if(backBtn){
    backBtn.addEventListener("click", function(){
      if(!activeKw) return;
      backBtn.hidden = true;
      scrollToTarget(null, activeKw);
      activeKw.classList.add("flash");
      window.setTimeout(function(){ activeKw.classList.remove("flash"); }, 1300);
    });
  }

  /* ---------- analysis fold + toggle all ---------- */
  function bodies(){ return Array.prototype.slice.call(document.querySelectorAll(".analysis-body")); }
  function setBody(body, open){
    if(!body) return;
    body.hidden = !open;
    var card = body.closest(".case");
    var btn = card ? card.querySelector(".analysis-body ~ *, .fold-btn") : null;
    var own = card ? card.querySelector('.fold-btn[data-fold="' + body.id + '"]') : null;
    if(own) own.textContent = open ? "收起解析" : "展开解析";
    if(own) own.setAttribute("aria-expanded", String(open));
  }
  function syncToggleAll(){
    var tl = document.getElementById("toggleAll");
    if(!tl) return;
    var anyClosed = bodies().some(function(b){ return b.hidden; });
    var l = tl.querySelector(".btn-label");
    if(l) l.textContent = anyClosed ? "展开全部解析" : "收起全部解析";
  }
  function setAll(open){
    bodies().forEach(function(b){ setBody(b, open); });
    syncToggleAll();
  }
  var foldBtns = document.querySelectorAll(".fold-btn");
  for(var f=0;f<foldBtns.length;f++){
    foldBtns[f].addEventListener("click", function(){
      var id = this.getAttribute("data-fold");
      var box = id ? document.getElementById(id) : null;
      if(!box) return;
      setBody(box, box.hidden);
      syncToggleAll();
    });
  }
  var toggleAll = document.getElementById("toggleAll");
  if(toggleAll){
    toggleAll.addEventListener("click", function(){
      var anyClosed = bodies().some(function(b){ return b.hidden; });
      setAll(anyClosed);
      toast(anyClosed ? "已展开全部解析" : "已收起全部解析");
    });
  }
  syncToggleAll();

  /* ---------- essay gist ---------- */
  document.body.classList.remove("hide-gist");
  var gistBtn = document.getElementById("gistBtn");
  if(gistBtn){
    gistBtn.addEventListener("click", function(){
      var hidden = document.body.classList.toggle("hide-gist");
      this.setAttribute("aria-pressed", String(!hidden));
      this.textContent = hidden ? "显示段意" : "隐藏段意";
    });
  }

  /* ---------- copy essay ---------- */
  var copyBtns = document.querySelectorAll(".copy-essay");
  for(var c=0;c<copyBtns.length;c++){
    copyBtns[c].addEventListener("click", function(){
      var id = this.getAttribute("data-copy");
      var src = document.getElementById(id);
      if(!src) return;
      var paras = src.querySelectorAll(".epara");
      var text = [];
      for(var i=0;i<paras.length;i++){
        var clone = paras[i].cloneNode(true);
        var gists = clone.querySelectorAll(".gist,.plabel");
        for(var g=0;g<gists.length;g++) gists[g].parentNode.removeChild(gists[g]);
        text.push(clone.textContent.replace(/\s+/g," ").trim());
      }
      var body = text.join("\n\n");
      function done(){ toast("范文已复制（" + body.split(/\s+/).length + " 词）"); }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(body).then(done, function(){ toast("复制失败，请手动选择文本"); });
      }else{
        var ta = document.createElement("textarea");
        ta.value = body; document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); done(); }catch(e){ toast("复制失败，请手动选择文本"); }
        document.body.removeChild(ta);
      }
    });
  }

  var printBtn = document.getElementById("printBtn");
  if(printBtn) printBtn.addEventListener("click", function(){ window.print(); });

  /* ---------- filter ---------- */
  var chips = document.querySelectorAll(".fchip");
  var cases = document.querySelectorAll(".case");
  var empty = document.getElementById("emptyState");
  function applyFilter(cat){
    var shown = 0;
    for(var i=0;i<cases.length;i++){
      var c = cases[i];
      var match = (cat === "all") || (c.getAttribute("data-cat") === cat) || (c.getAttribute("data-task") === cat);
      c.hidden = !match;
      if(match) shown++;
    }
    var groups = document.querySelectorAll(".cat-group");
    for(var g=0;g<groups.length;g++){
      var inner = groups[g].querySelectorAll(".case");
      var any = false;
      for(var n=0;n<inner.length;n++) if(!inner[n].hidden) any = true;
      groups[g].hidden = !any;
    }
    var tasks = document.querySelectorAll(".task-block");
    for(var t=0;t<tasks.length;t++){
      var ic = tasks[t].querySelectorAll(".case"), vis = false;
      for(var m=0;m<ic.length;m++) if(!ic[m].hidden) vis = true;
      tasks[t].hidden = !vis;
    }
    var tocLinks = document.querySelectorAll(".toc a[data-cat]");
    for(var l=0;l<tocLinks.length;l++){
      var lc = tocLinks[l].getAttribute("data-cat");
      var keep = (cat === "all") || lc === cat || lc.indexOf(cat + ":") === 0;
      tocLinks[l].hidden = !keep;
    }
    if(empty) empty.hidden = shown !== 0;
  }
  for(var ch=0;ch<chips.length;ch++){
    chips[ch].addEventListener("click", function(){
      for(var x=0;x<chips.length;x++) chips[x].setAttribute("aria-pressed", "false");
      this.setAttribute("aria-pressed", "true");
      applyFilter(this.getAttribute("data-filter"));
    });
  }

  /* ---------- scrollspy ---------- */
  var spyLinks = Array.prototype.slice.call(document.querySelectorAll(".toc a[data-cat]"));
  if("IntersectionObserver" in window && spyLinks.length){
    var map = {};
    spyLinks.forEach(function(a){ map[a.getAttribute("href").slice(1)] = a; });
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        var link = map[en.target.id];
        if(!link) return;
        spyLinks.forEach(function(a){ a.classList.remove("is-current"); });
        link.classList.add("is-current");
      });
    }, {rootMargin: "-18% 0px -68% 0px", threshold: 0});
    document.querySelectorAll(".case, .appendix, .hero").forEach(function(el){
      if(el.id) io.observe(el);
    });
  }
})();
</script>
